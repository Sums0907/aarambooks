version: "3.8"

services:
  shopdeck-postgres:
    image: postgres:16
    container_name: shopdeck-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopdeck_pass}
      POSTGRES_DB: ${POSTGRES_DB:-shopdeck_bs_prod}
    volumes:
      - shopdeck-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopdeck_bs_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopdeck-network
    restart: unless-stopped

  shopdeck-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: shopdeck-api
    working_dir: /app/backend
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8200"]
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - SHOPDECK_MCP_URL=${SHOPDECK_MCP_URL}
      - SHOPDECK_MCP_TOKEN=${SHOPDECK_MCP_TOKEN}
      - AARAM_BRAIN_URL=${AARAM_BRAIN_URL:-}
      - IDENTITY_API_URL=${IDENTITY_API_URL}
      - PYTHONPATH=/app/backend
    ports:
      - "8210:8200"
    depends_on:
      shopdeck-postgres:
        condition: service_healthy
    networks:
      - shopdeck-network
    restart: unless-stopped

  shopdeck-sync:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: shopdeck-sync
    working_dir: /app
    command: ["bash", "backend/sync/start_sync_daemon.sh"]
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL}
      - SHOPDECK_MCP_URL=${SHOPDECK_MCP_URL}
      - SHOPDECK_MCP_TOKEN=${SHOPDECK_MCP_TOKEN}
      - AARAM_BRAIN_URL=${AARAM_BRAIN_URL:-}
      - PYTHONPATH=/app/backend
    depends_on:
      shopdeck-postgres:
        condition: service_healthy
    networks:
      - shopdeck-network
    restart: always

networks:
  shopdeck-network:
    driver: bridge

volumes:
  shopdeck-postgres-data:
