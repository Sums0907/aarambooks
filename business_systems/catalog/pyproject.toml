[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aarambooks-catalog-bs"
version = "1.1.0"
description = "Sovereign Catalog Business System for AaramBooks"
readme = "docs/01-catalog-bs.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "asyncpg>=0.28.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
