name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Security Check (Safety)
      run: |
        pip install safety
        safety check -r requirements.txt --full-report || true
    - name: Run Tests
      run: |
        echo "database_url=postgresql+asyncpg://postgres:postgres@localhost:5432/dummy" > .env
        echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/dummy" >> .env
        echo "DATABASE_URL_SYNC=postgresql+asyncpg://postgres:postgres@localhost:5432/dummy" >> .env
        echo "SHOPDECK_MCP_URL=http://dummy:8000" >> .env
        echo "SHOPDECK_MCP_TOKEN=dummy" >> .env
        echo "OPENAI_API_KEY=dummy" >> .env
        pip install pytest pytest-asyncio httpx psycopg2-binary motor pymongo
        PYTHONPATH=.:business_systems/shopdeck/backend pytest -v
    - name: Build Production Image
      run: |
        docker build -t aarambooks-brain-core:prod .
