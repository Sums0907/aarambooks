name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Security Check (Safety)
      run: |
        pip install safety
        safety check -r requirements.txt --full-report || true
    - name: Run Tests (Temporarily Disabled)
      run: |
        echo "Tests are temporarily disabled because the core repo test suite is undergoing major refactoring and decoupling."
    - name: Build Production Image
      run: |
        docker build -f Dockerfile.prod -t aarambooks-brain-core:prod .
