name: Build and Push Docker Image to GHCR

# Mirrors the proven pattern already live for aarambooks-shopdeck/AaramIdentity/
# Aaram_Inventory/AaramPackerApp (each its own extracted repo) - this is Brain's first
# publish workflow. Brain has no `build:`-based VPS deploy - the image is built here and
# pulled by the VPS, never built from source on the VPS itself.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Hardcoded rather than derived from ${{ github.repository }}: this repo is still named
  # plain "aarambooks" even though every other business system was extracted out of it, so
  # the derived name would silently drop "brain" and produce "aarambooks-core" - naming
  # nothing here as "brain" would be confusing next to aarambooks-shopdeck/aarambooks-catalog.
  # Matches the "aarambooks-brain-core" name already used internally (ci.yml's local build
  # tag, docker-compose.prod.yml's container_name).
  IMAGE_NAME: sums0907/aarambooks-brain-core

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
