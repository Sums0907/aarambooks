[pytest]
asyncio_mode = auto
# Without this, a bare `pytest` from repo root recursively collects test_*.py from
# everywhere - including scratch/ and scratch_shopdeck_canonical/, which hold ad-hoc,
# never-maintained debug scripts that were sitting loose in the repo root until the
# 2026-09-12 cleanup. Scoping to tests/ matches how this suite has actually been run and
# verified throughout development (business_systems/catalog has its own separate test suite,
# run independently, not implied by this repo's own `pytest` invocation).
testpaths = tests
