version: "3.8"

# Production compose for AaramBooks Brain. Unlike docker-compose.yml (dev: --reload,
# live-mounted ./src, host.docker.internal Ollama), every service here is self-contained
# inside this stack - no dependency on the developer machine.
#
# This file has no `build:` for aarambooks-brain-api and is not paired with a git checkout
# on the VPS - it pulls a pre-built image from GHCR, matching the proven pattern already live
# for every other AaramBooks service (aarambooks-shopdeck, AaramIdentity, Aaram_Inventory,
# AaramPackerApp - each its own repo, each publishing to GHCR via its own
# docker-publish.yml). This file itself, plus .env and litellm_config.prod.yaml, are the only
# things that need to exist on the VPS - no source checkout, matching this fleet's
# images-only-VPS discipline (see docs/claude/VPS_CLEANUP_PLAN_BRAIN_MONOREPO_CLONE.md for
# why an accidental git clone on the VPS was treated as something to clean up, not keep).
#
# Brain's two background workers (NDRQueuePoller, OutboundWritebackWorker) run as asyncio
# tasks inside the FastAPI process's own event loop (see src/main.py's lifespan) - they are
# not separate containers, and never will be as long as that stays true.

services:
  aarambooks-brain-api:
    image: ghcr.io/sums0907/aarambooks-brain-core:main
    container_name: aarambooks-brain-api
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD required}@aarambooks-brain-db:5432/${DB_NAME:-aarambooks_brain_core_prod}
      - MONGO_URI=mongodb://aarambooks-brain-mongo:27017
      - LITELLM_BASE_URL=http://litellm:4000
    ports:
      - "8000:8000"
    depends_on:
      aarambooks-brain-db:
        condition: service_healthy
      aarambooks-brain-mongo:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - brain-network

  aarambooks-brain-db:
    image: pgvector/pgvector:pg16
    container_name: aarambooks-brain-db
    environment:
      POSTGRES_DB: ${DB_NAME:-aarambooks_brain_core_prod}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - brain-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aarambooks_brain_core_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - brain-network

  aarambooks-brain-mongo:
    image: mongo:7
    container_name: aarambooks-brain-mongo
    volumes:
      - brain-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - brain-network

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-brain-prod
    command: --config /app/config.yaml --port 4000
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY required}
    volumes:
      - ./litellm_config.prod.yaml:/app/config.yaml
    restart: unless-stopped
    networks:
      - brain-network

networks:
  brain-network:
    driver: bridge

volumes:
  brain-postgres-data:
  brain-mongo-data:
