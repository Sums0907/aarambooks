version: '3.8'

services:
  aarambooks-brain-api:
    build: .
    container_name: aarambooks-brain-api-${ENVIRONMENT:-dev}
    environment:
      - PORT=${PORT:-8000}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${AARAM_DB_URL}
    depends_on:
      aarambooks-brain-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-8000}/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  aarambooks-brain-db:
    image: pgvector/pgvector:pg16
    container_name: aarambooks-brain-db-${ENVIRONMENT:-dev}
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-aarambooks_brain_core_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-aarambooks_brain_core_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-${ENVIRONMENT:-dev}
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: --config /app/config.yaml --port 4000
    restart: always

volumes:
  postgres_data:
