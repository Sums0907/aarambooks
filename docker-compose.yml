services:
  aarambooks-brain-api:
    build: .
    container_name: aarambooks-brain-api-${ENVIRONMENT:-dev}
    depends_on:
      aarambooks-brain-db:
        condition: service_healthy
    environment:
    - PORT=${PORT:-8000}
    - ENVIRONMENT=${ENVIRONMENT:-development}
    - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@aarambooks-brain-db:5432/${DB_NAME:-aarambooks_brain_core_dev}
    - INVENTORY_URL=${INVENTORY_URL:-http://host.docker.internal:8100}
    - LITELLM_BASE_URL=http://litellm:4000
    healthcheck:
      interval: 10s
      retries: 3
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-8000}/health')"
      timeout: 5s
  aarambooks-brain-db:
    container_name: aarambooks-brain-db-${ENVIRONMENT:-dev}
    environment:
      POSTGRES_DB: ${DB_NAME:-aarambooks_brain_core_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-aarambooks_brain_core_dev}
      timeout: 5s
    image: pgvector/pgvector:pg16
    ports:
    - "5434:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
  litellm:
    command: --config /app/config.yaml --port 4000
    container_name: litellm-${ENVIRONMENT:-dev}
    environment:
    - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    - LITELLM_BASE_URL=http://litellm:4000
    - DATABASE_URL=postgresql://postgres:postgres@aarambooks-brain-db:5432/aarambooks_brain_core_dev
    image: ghcr.io/berriai/litellm:main-latest
    restart: always
    volumes:
    - ./litellm_config.yaml:/app/config.yaml
version: '3.8'
volumes:
  postgres_data: null
